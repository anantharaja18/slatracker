[theme]
base = "dark"
primaryColor = "#3B82F6"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#161B22"
textColor = "#E6EDF3"
font = "sans serif"

[server]
headless = true

[client]
# pages/ (Ticket Trend Analysis) is opened from the dashboard's own button,
# so Streamlit's sidebar page list is hidden.
showSidebarNavigation = false
